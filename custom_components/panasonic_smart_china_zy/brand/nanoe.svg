<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <!-- Panasonic nanoe ion mark reconstructed from the official App asset:
       one large disc with a straight right edge + a small satellite dot.
       The canvas is padded so the mark keeps the optical size of a 24px MDI
       glyph when HA renders it edge-to-edge inside an icon slot. -->
  <defs>
    <clipPath id="disc-cut"><rect x="0" y="0" width="22.6" height="32"/></clipPath>
  </defs>
  <g transform="translate(4.2,6)">
    <circle cx="13" cy="16" r="11" fill="#2C4198" clip-path="url(#disc-cut)"/>
    <circle cx="29" cy="16" r="4.6" fill="#2C4198"/>
  </g>
</svg>
